inherit_from: .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 3.3.10

plugins:
  - rubocop-rake
  - rubocop-rspec
  - rubocop-factory_bot

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 1200

Metrics/BlockLength:
  Exclude:
    - 'Rakefile'
    - '**/*.rake'
    - '**/*_spec.rb'
